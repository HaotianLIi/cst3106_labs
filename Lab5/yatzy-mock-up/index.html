<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yatzy</title>
  <link rel="stylesheet" href="../dice-design/dice.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Yatzy mock-up for lab 5, no JavaScript yet -->
<!-- layout is based on the HTML structure from lecture 5 -->

<div class="game-container">

  <h1>Yatzy</h1>

  <!-- message for the player, will be updated with JS later -->
  <p id="message">Round 1 of 15 - Roll 1 of 3</p>

  <!-- 5 dice (same html that showDie() in 07_dice.js makes) -->
  <!-- showing 4 4 4 6 6 as an example roll -->
  <div class="dice-group">

    <div id="die01" class="dice-container">
      <div class="dice">
        <div class="top-left"><div class="dot"></div></div>
        <div class="top-right"><div class="dot"></div></div>
        <div class="bottom-left"><div class="dot"></div></div>
        <div class="bottom-right"><div class="dot"></div></div>
      </div>
    </div>

    <div id="die02" class="dice-container">
      <div class="dice">
        <div class="top-left"><div class="dot"></div></div>
        <div class="top-right"><div class="dot"></div></div>
        <div class="bottom-left"><div class="dot"></div></div>
        <div class="bottom-right"><div class="dot"></div></div>
      </div>
    </div>

    <div id="die03" class="dice-container">
      <div class="dice">
        <div class="top-left"><div class="dot"></div></div>
        <div class="top-right"><div class="dot"></div></div>
        <div class="bottom-left"><div class="dot"></div></div>
        <div class="bottom-right"><div class="dot"></div></div>
      </div>
    </div>

    <div id="die04" class="dice-container">
      <div class="dice">
        <div class="top-left"><div class="dot"></div></div>
        <div class="top-right"><div class="dot"></div></div>
        <div class="bottom-left"><div class="dot"></div></div>
        <div class="bottom-right"><div class="dot"></div></div>
        <div class="middle-left"><div class="dot"></div></div>
        <div class="middle-right"><div class="dot"></div></div>
      </div>
    </div>

    <div id="die05" class="dice-container">
      <div class="dice">
        <div class="top-left"><div class="dot"></div></div>
        <div class="top-right"><div class="dot"></div></div>
        <div class="bottom-left"><div class="dot"></div></div>
        <div class="bottom-right"><div class="dot"></div></div>
        <div class="middle-left"><div class="dot"></div></div>
        <div class="middle-right"><div class="dot"></div></div>
      </div>
    </div>
  </div>

  <button id="rollButton">Roll Dice</button>

  <!-- scorecard, all scores start at 0 -->
  <table class="scorecard">

    <!-- upper section -->
    <tr><th colspan="2">Upper Section</th></tr>
    <tr class="score-section"><td><label>Ones</label></td><td><span id="onesScore">0</span></td></tr>
    <tr class="score-section"><td><label>Twos</label></td><td><span id="twosScore">0</span></td></tr>
    <tr class="score-section"><td><label>Threes</label></td><td><span id="threesScore">0</span></td></tr>
    <tr class="score-section"><td><label>Fours</label></td><td><span id="foursScore">0</span></td></tr>
    <tr class="score-section"><td><label>Fives</label></td><td><span id="fivesScore">0</span></td></tr>
    <tr class="score-section"><td><label>Sixes</label></td><td><span id="sixesScore">0</span></td></tr>
    <tr class="score-section"><td><label>Sum</label></td><td><span id="upperSum">0</span></td></tr>
    <tr class="score-section"><td><label>Bonus</label></td><td><span id="bonusScore">0</span></td></tr>

    <!-- lower section -->
    <tr><th colspan="2">Lower Section</th></tr>
    <tr class="score-section"><td><label>One Pair</label></td><td><span id="onePairScore">0</span></td></tr>
    <tr class="score-section"><td><label>Two Pairs</label></td><td><span id="twoPairsScore">0</span></td></tr>
    <tr class="score-section"><td><label>Three of a Kind</label></td><td><span id="threeKindScore">0</span></td></tr>
    <tr class="score-section"><td><label>Four of a Kind</label></td><td><span id="fourKindScore">0</span></td></tr>
    <tr class="score-section"><td><label>Small Straight</label></td><td><span id="smallStraightScore">0</span></td></tr>
    <tr class="score-section"><td><label>Large Straight</label></td><td><span id="largeStraightScore">0</span></td></tr>
    <tr class="score-section"><td><label>Full House</label></td><td><span id="fullHouseScore">0</span></td></tr>
    <tr class="score-section"><td><label>Chance</label></td><td><span id="chanceScore">0</span></td></tr>
    <tr class="score-section"><td><label>Yatzy</label></td><td><span id="yatzyScore">0</span></td></tr>
  </table>

  <div id="totalScore">Total: 0</div>

</div>

</body>
</html>
