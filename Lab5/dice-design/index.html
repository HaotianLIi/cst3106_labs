<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice Design</title>
  <link rel="stylesheet" href="dice.css">
</head>
<body>

  <h1>Dice Design</h1>

  <p>The dice are from the class sample 07_dice.css.</p>
  <ul>
    <li>Size: 100 x 100px with rounded corners (15px)</li>
    <li>1px black border, no background color</li>
    <li>Dots are black 20px circles</li>
    <li>Dots are placed with absolute positioning (top-left, middle, bottom-right, etc.)</li>
  </ul>

  <h2>All 6 faces</h2>

  <!-- same dot positions as positions() in 07_dice.js -->
  <div class="dice-group">

    <!-- 1 -->
    <div class="dice-container">
      <div class="dice">
        <div class="middle"><div class="dot"></div></div>
      </div>
    </div>

    <!-- 2 -->
    <div class="dice-container">
      <div class="dice">
        <div class="top-left"><div class="dot"></div></div>
        <div class="bottom-right"><div class="dot"></div></div>
      </div>
    </div>

    <!-- 3 -->
    <div class="dice-container">
      <div class="dice">
        <div class="top-left"><div class="dot"></div></div>
        <div class="middle"><div class="dot"></div></div>
        <div class="bottom-right"><div class="dot"></div></div>
      </div>
    </div>

    <!-- 4 -->
    <div class="dice-container">
      <div class="dice">
        <div class="top-left"><div class="dot"></div></div>
        <div class="top-right"><div class="dot"></div></div>
        <div class="bottom-left"><div class="dot"></div></div>
        <div class="bottom-right"><div class="dot"></div></div>
      </div>
    </div>

    <!-- 5 -->
    <div class="dice-container">
      <div class="dice">
        <div class="top-left"><div class="dot"></div></div>
        <div class="top-right"><div class="dot"></div></div>
        <div class="bottom-left"><div class="dot"></div></div>
        <div class="bottom-right"><div class="dot"></div></div>
        <div class="middle"><div class="dot"></div></div>
      </div>
    </div>

    <!-- 6 -->
    <div class="dice-container">
      <div class="dice">
        <div class="top-left"><div class="dot"></div></div>
        <div class="top-right"><div class="dot"></div></div>
        <div class="bottom-left"><div class="dot"></div></div>
        <div class="bottom-right"><div class="dot"></div></div>
        <div class="middle-left"><div class="dot"></div></div>
        <div class="middle-right"><div class="dot"></div></div>
      </div>
    </div>
  </div>

</body>
</html>
